name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-appimage:
    name: Linux AppImage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build qt6-base-dev qt6-base-dev-tools \
            libqscintilla2-qt6-dev libgl1-mesa-dev libfuse2 curl file
      - name: Build AppImage
        run: packaging/appimage/build-appimage.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/*.AppImage

  macos-dmg:
    name: macOS DMG (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          brew install cmake ninja qt qscintilla2
      - name: Build unsigned DMG
        # Signing and notarization are intentionally deferred; see
        # packaging/macos/SIGNING.md.
        run: packaging/macos/build-dmg.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ matrix.os }}
          path: dist/*.dmg

  release:
    name: Publish GitHub release
    needs: [linux-appimage, macos-dmg]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -lh dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
